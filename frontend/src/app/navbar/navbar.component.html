<mat-toolbar class="navbar">
  <div class="brand">
    <img src="images/jio-logo.png" alt="Jio" class="brand-logo" />
    <div class="brand-text">
      <span class="brand-title">Centralised RAN Network</span>
      <span class="brand-sub">Insight &amp; Operations Centre</span>
    </div>
  </div>

  <nav class="nav-links">
    <a class="nav-item" routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Dashboard</a>
    <a class="nav-item" routerLink="/ucem" routerLinkActive="active">UCEM</a>
    <a class="nav-item" routerLink="/son" routerLinkActive="active">SON</a>
    <a class="nav-item" routerLink="/ems" routerLinkActive="active">EMS</a>
    <span class="nav-item disabled" title="Coming soon">Help</span>
    <button
      type="button"
      class="nav-item nav-dropdown"
      *ngIf="canAccessUserManagement"
      [class.active]="isAccessControlActive"
      [matMenuTriggerFor]="accessControlMenu"
    >
      Access Control
      <mat-icon class="nav-chevron">expand_more</mat-icon>
    </button>
  </nav>

  <mat-menu #accessControlMenu="matMenu">
    <button mat-menu-item routerLink="/access-control/roles"><mat-icon>admin_panel_settings</mat-icon><span>Roles</span></button>
    <button mat-menu-item routerLink="/access-control/users"><mat-icon>group</mat-icon><span>Users</span></button>
  </mat-menu>

  <button type="button" class="hamburger-btn" [matMenuTriggerFor]="mobileMenu" aria-label="Open navigation menu">
    <mat-icon>menu</mat-icon>
  </button>

  <mat-menu #mobileMenu="matMenu" class="mobile-nav-menu">
    <button mat-menu-item routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
      <mat-icon>dashboard</mat-icon><span>Dashboard</span>
    </button>
    <button mat-menu-item routerLink="/ucem" routerLinkActive="active">
      <mat-icon>router</mat-icon><span>UCEM</span>
    </button>
    <button mat-menu-item routerLink="/son" routerLinkActive="active">
      <mat-icon>hub</mat-icon><span>SON</span>
    </button>
    <button mat-menu-item routerLink="/ems" routerLinkActive="active">
      <mat-icon>settings_input_antenna</mat-icon><span>EMS</span>
    </button>
    <button mat-menu-item disabled>
      <mat-icon>help_outline</mat-icon><span>Help</span>
    </button>
    <ng-container *ngIf="canAccessUserManagement">
      <button mat-menu-item routerLink="/access-control/roles">
        <mat-icon>admin_panel_settings</mat-icon><span>Access Control &middot; Roles</span>
      </button>
      <button mat-menu-item routerLink="/access-control/users">
        <mat-icon>group</mat-icon><span>Access Control &middot; Users</span>
      </button>
    </ng-container>
  </mat-menu>

  <span class="spacer"></span>

  <button type="button" class="theme-toggle" (click)="toggleTheme()" [attr.aria-label]="isDarkMode ? 'Switch to light mode' : 'Switch to dark mode'" [attr.title]="isDarkMode ? 'Light mode' : 'Dark mode'">
    <mat-icon>{{ isDarkMode ? 'light_mode' : 'dark_mode' }}</mat-icon>
  </button>

  <button class="user-menu-trigger" [matMenuTriggerFor]="userMenu">
    <div class="avatar" *ngIf="currentUser$ | async as user">{{ (user.name || user.username || '?').charAt(0).toUpperCase() }}</div>
    <span class="user-name" *ngIf="currentUser$ | async as user">{{ user.name }}</span>
    <mat-icon class="chevron">expand_more</mat-icon>
  </button>

  <mat-menu #userMenu="matMenu">
    <button mat-menu-item (click)="onLogout()"><mat-icon>logout</mat-icon><span>Logout</span></button>
  </mat-menu>
</mat-toolbar>
