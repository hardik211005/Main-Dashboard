<div class="ne-tree">
  <div class="tree-top">
    <button type="button" class="fav-link" (click)="ucem.openFavouritesDialog()">
      View Favourites
    </button>
    <button type="button" class="icon-btn" (click)="ucem.openFilterDialog()" title="Filter">
      <mat-icon>filter_list</mat-icon>
    </button>
  </div>

  <div class="search-box">
    <mat-icon>search</mat-icon>
    <input
      type="text"
      placeholder="Search here..."
      [ngModel]="ucem.searchTerm()"
      (ngModelChange)="ucem.searchTerm.set($event)"
    />
  </div>

  <div class="tree-scroll">
    @for (group of ucem.filteredCircles(); track group.name) {
      <div class="circle-group">
        <button type="button" class="circle-header" (click)="ucem.toggleCircle(group.name)">
          <span class="circle-name">{{ group.name }} - <span class="circle-count">{{ group.totalCount }}</span></span>
          <mat-icon>{{ group.expanded ? 'expand_less' : 'expand_more' }}</mat-icon>
        </button>

        @if (group.expanded) {
          <div class="ne-list">
            @for (nodeItem of group.nes; track nodeItem.id) {
              <div class="ne-row" [class.selected]="ucem.selectedNeId() === nodeItem.id" (click)="ucem.selectNe(nodeItem.id)">
                <input
                  type="checkbox"
                  [checked]="ucem.selectedNeId() === nodeItem.id"
                  (click)="$event.stopPropagation(); ucem.selectNe(nodeItem.id)"
                />
                <span class="ne-name" (click)="ucem.openNodeInfo(nodeItem.id, $event)">{{ nodeItem.label }}</span>
                <span [ngClass]="statusClass(nodeItem.status)"></span>
                <button type="button" class="icon-btn small" (click)="ucem.toggleFavourite(nodeItem.id, $event)" [title]="ucem.favourites().has(nodeItem.id) ? 'Remove favourite' : 'Add favourite'">
                  <mat-icon>{{ ucem.favourites().has(nodeItem.id) ? 'star' : 'insert_drive_file' }}</mat-icon>
                </button>
              </div>
            }
          </div>
        }
      </div>
    }

    @if (ucem.filteredCircles().length === 0) {
      <div class="empty-tree">No matching NEs found.</div>
    }
  </div>
</div>
